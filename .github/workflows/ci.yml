name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=smoke-chromium
      - run: pnpm test:e2e --project=visual-desktop --project=visual-mobile
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python manage.py check --settings=config.settings.test
      - name: Django production deployment checks
        env:
          DJANGO_SECRET_KEY: production-check-only-not-a-real-secret-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: api.example.com,healthcheck.railway.app
          DJANGO_CORS_ALLOWED_ORIGINS: https://example.com,https://client.example.com,https://staff.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com,https://client.example.com,https://staff.example.com
          STAFF_MFA_REQUIRED: "true"
          PUBLIC_SITE_URL: https://example.com
          CLIENT_SITE_URL: https://client.example.com
          STAFF_SITE_URL: https://staff.example.com
          PRODUCTION_EXPECTED_PUBLIC_ORIGIN: https://example.com
          PRODUCTION_EXPECTED_CLIENT_ORIGIN: https://client.example.com
          PRODUCTION_EXPECTED_STAFF_ORIGIN: https://staff.example.com
          PRODUCTION_EXPECTED_API_HOST: api.example.com
          PRODUCTION_EXPECTED_DATABASE_HOST: prod-db.example.com
          PRODUCTION_EXPECTED_DATABASE_DIRECT_HOST: prod-db-direct.example.com
          PRODUCTION_EXPECTED_DATABASE_NAME: niskala_prod
          PRODUCTION_EXPECTED_REDIS_HOST: prod-redis.example.com
          PRODUCTION_EXPECTED_CLOUDINARY_CLOUD_NAME: niskala-production
          CAPABILITY_KEYS_JSON: '{"ci":"Ci-capability-2026!Az3#Km7$Np2%Qr5&St8*Vx1"}'
          CAPABILITY_PRIMARY_KEY_ID: ci
          NISKALA_BFF_SHARED_SECRET: Bff-ci-2026!Az3#Km7$Np2%Qr5&St8*Vx1
          DATABASE_URL: postgresql://ci:ci@prod-db.example.com:5432/niskala_prod
          DATABASE_DIRECT_URL: postgresql://ci:ci@prod-db-direct.example.com:5432/niskala_prod
          REDIS_URL: redis://prod-redis.example.com:6379/0
          CELERY_BROKER_URL: redis://prod-redis.example.com:6379/1
          CELERY_RESULT_BACKEND: redis://prod-redis.example.com:6379/2
          CLOUDINARY_CLOUD_NAME: niskala-production
          CLOUDINARY_API_KEY: ci-cloudinary-key
          CLOUDINARY_API_SECRET: ci-cloudinary-secret
          SENTRY_DSN: https://public@example.ingest.sentry.io/1
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_RELEASE: ci-check
          SENTRY_ENVIRONMENT: production
        run: python manage.py check --deploy --settings=config.settings.production
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pytest
      - name: Test deployment isolation tooling
        run: python -m unittest discover -s ../../infra/deployment -p "test_*.py"
      - run: python ../../infra/deployment/validate_config.py
      - run: docker build --tag wedding-api-ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
